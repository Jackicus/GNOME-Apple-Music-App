[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, the quote style (single quotes; docstrings and other multi-line
# strings in double), bugbear and pyupgrade.
select = ["E", "F", "W", "Q", "B", "UP"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# Vendored from the GNOME Shell extension in upstream's style (double quotes, long lines,
# annotations) until the backend package reformats them as this app's fork.
"src/backend/normalize.py" = ["Q", "E501", "UP", "B"]
"tests/test_normalize.py" = ["Q", "E501", "UP", "B"]
"tests/test_demo_schema.py" = ["Q", "E501", "UP", "B"]
"scripts/demo_library.py" = ["Q", "E501", "UP", "B"]
