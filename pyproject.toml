[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, the quote style (single quotes; docstrings and other multi-line
# strings in double), bugbear and pyupgrade.
select = ["E", "F", "W", "Q", "B", "UP"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

