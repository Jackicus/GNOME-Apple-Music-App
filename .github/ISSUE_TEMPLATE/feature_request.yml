name: Feature request
description: Suggest an idea or an improvement for Music Sleeve.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The app aims to feel like a GNOME core app while laying out its pages like Apple
        Music's web player. Ideas that fit the
        [GNOME Human Interface Guidelines](https://developer.gnome.org/hig/) are the easiest
        to take on.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How should it work? Mock-ups and comparisons with the web player or other GNOME apps are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
