<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- A proposal only (docs/icon-proposal.md): nothing installs this file. -->
  <!-- SPDX-License-Identifier: GPL-2.0-or-later -->
  <!-- SPDX-FileCopyrightText: 2026 Jack Tully -->
  <defs>
    <linearGradient id="sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dc8add"/>
      <stop offset="1" stop-color="#c061cb"/>
    </linearGradient>
    <linearGradient id="sleeve-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9141ac"/>
      <stop offset="1" stop-color="#813d9c"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.3" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </radialGradient>
  </defs>
  <!-- The record, half out of its sleeve: its edge (the side) and its face. -->
  <circle cx="78" cy="62" r="42" fill="#000000"/>
  <circle cx="78" cy="58" r="42" fill="url(#disc)"/>
  <g fill="none" stroke="#5e5c64" stroke-opacity="0.55" stroke-width="1">
    <circle cx="78" cy="58" r="36"/>
    <circle cx="78" cy="58" r="31"/>
    <circle cx="78" cy="58" r="26"/>
    <circle cx="78" cy="58" r="21"/>
  </g>
  <circle cx="78" cy="58" r="13" fill="#ffbe6f"/>
  <circle cx="78" cy="58" r="13" fill="none" stroke="#e66100" stroke-width="2"/>
  <circle cx="78" cy="58" r="2.5" fill="#241f31"/>
  <!-- The sleeve in front: its side below, then its face. -->
  <rect x="12" y="30" width="72" height="84" rx="8" fill="url(#sleeve-side)"/>
  <rect x="12" y="24" width="72" height="84" rx="8" fill="url(#sleeve)"/>
  <rect x="12" y="24" width="72" height="84" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
  <!-- A sound wave across the sleeve: bars of a level meter. -->
  <g fill="#ffffff">
    <rect x="24" y="62" width="6" height="16" rx="3"/>
    <rect x="34" y="50" width="6" height="40" rx="3"/>
    <rect x="44" y="56" width="6" height="28" rx="3"/>
    <rect x="54" y="44" width="6" height="52" rx="3"/>
    <rect x="64" y="58" width="6" height="24" rx="3"/>
  </g>
</svg>
